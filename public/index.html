<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>whim</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <video id="vid-player" controls controlslist="nodownload" hidden></video>

    <main id="pdf-viewer" hidden>
      <header id</main>="pdf-toolbar">
        <div class="pdf-page-controls">
          <button id="pdf-prev" type="button" aria-label="Previous page">‹</button>
          <span><span id="pdf-page-number">1</span> / <span id="pdf-page-count">0</span></span>
          <button id="pdf-next" type="button" aria-label="Next page">›</button>
        </div>
        <div class="pdf-zoom-controls">
          <button id="pdf-zoom-out" type="button" aria-label="Zoom out">−</button>
          <span id="pdf-zoom-level">100%</span>
          <button id="pdf-zoom-in" type="button" aria-label="Zoom in">+</button>
        </div>
      </header>
      <section id="pdf-pages" aria-live="polite"></section>
      <p id="pdf-status" role="status"></p>
    </main>

    <script type="module" src="index.js"></script>
  </body>
</html>
